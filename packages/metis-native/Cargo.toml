[package]
authors = ["Daniel Grondin <king@numsgil.co>"]
edition = "2021"
name = "metis_native"
version = "0.1.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.0.0", features = ["async", "napi8"] }
napi-derive = "3.0.0"
mimalloc = { version = "0.1", default-features = false }
wgpu = { version = "30", features = ["wgsl"] }
raw-window-handle = "0.6"
tokio = { version = "1", features = ["sync"] }
sdl3-sys = { version = "0.6.7", features = ["build-from-source-static"] }
num_enum = "0.7.6"
lyon_tessellation = "1"
lyon_path = "1"
lyon_geom = "1"
ttf-parser = "0.21"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "tga", "hdr", "webp"] }
half = "2.7.1"
ktx2 = "0.5"
ruzstd = "0.8.3"
# glTF 2.0. `default-features = false` drops the crate's own `import` feature,
# which would pull in its own `image` copy and its own URI/base64 handling — this
# crate resolves URIs itself (see `gltf/uri.rs`) so that the resource-override
# hook can intercept before any byte is read. `extensions` keeps unrecognised
# extension objects as raw JSON instead of discarding them; `extras` does the
# same for `extras`. The KHR_* features are the ones gltf-json models natively;
# the rest (clearcoat, sheen, anisotropy, iridescence, dispersion) are parsed
# from that raw JSON in `gltf/material.rs`.
gltf = { version = "1.4.1", default-features = false, features = [
  "utils", "names", "extras", "extensions",
  "KHR_lights_punctual",
  "KHR_materials_emissive_strength",
  "KHR_materials_ior",
  "KHR_materials_specular",
  "KHR_materials_transmission",
  "KHR_materials_unlit",
  "KHR_materials_variants",
  "KHR_materials_volume",
  "KHR_texture_transform",
] }
serde_json = "1"
base64 = "0.22"
percent-encoding = "2"
# Audio decoding. Pure Rust, same rule as the image decoders — no C decoder in
# the path (see CLAUDE.md, "Why SDL3_image is gone"). `all` turns on every
# royalty-free codec and container symphonia ships (wav/flac/mp3/aac/alac/
# vorbis/adpcm + mkv/isomp4/ogg/caf/aiff) plus the metadata readers; the set is
# a compile-time cost only, and a game that can't open the file the artist
# handed it is a worse trade than a slightly longer link.
symphonia = { version = "0.6", features = ["all"] }
# Steam Audio, for HRTF binaural rendering. The one place this crate knowingly
# takes on a C++ dependency, and it is not a small one:
#
#   - `audionimbus-sys` runs **bindgen** at build time, so the build machine
#     needs libclang (`winget install LLVM.LLVM`).
#   - `auto-install` downloads Valve's prebuilt Steam Audio release at build
#     time (curl or wget) and links `phonon` dynamically — so `phonon.dll` must
#     sit next to the `.node` at *runtime*, not just at link time.
#
# Both are real costs and both were the reason this was deferred when the audio
# module first landed. Accepted deliberately: there is no pure-Rust HRTF
# renderer of comparable quality, and hand-rolling one is a research project,
# not a feature. See `audio/spatial.rs`.
audionimbus = { version = "0.16", default-features = false, features = ["auto-install"] }

[build-dependencies]
napi-build = "2"

# TODO(physics): re-evaluate `lto = "fat"` once a physics engine lands here.
# Fat LTO costs ~103 s per incremental release build (vs ~19 s for `fastdev`)
# and currently buys close to nothing: this crate is a GPU-bound FFI shim, so
# the hot path is inside the driver, not in cross-crate inlining. A CPU-bound
# solver is the opposite case and is where fat LTO would start paying for
# itself — so measure it then rather than dropping it pre-emptively now.
# Decided 2026-07-21; physics ETA unknown.
[profile.release]
strip = "symbols"
opt-level = 3
lto = "fat"
codegen-units = 1

# Optimized but fast to build — for profiling runs where `release`'s fat-LTO
# link (measured: ~103 s to rebuild after a one-line change) dominates the
# edit-measure loop. Ships nothing; use `release` for that.
[profile.fastdev]
inherits = "release"
lto = false
codegen-units = 16
# Measured 2026-08-08, and the split between these two is the whole point:
# `overflow-checks` costs roughly *half again* the time of the tightest
# arithmetic loops here (the mixer's per-sample inner loop), while
# `debug-assertions` is free — indistinguishable from baseline on the same
# benchmark. Since `fastdev` is the profile used for perf work, an
# overflow-checked build would make its own numbers lie, which is the one thing
# it must not do. So: assertions on, overflow checks off.
#
# `overflow-checks` must be set explicitly — cargo defaults it to whatever
# `debug-assertions` is, so omitting it silently turns it on.
#
# Re-measure with `bun run tests/audio-bench.ts` (arithmetic-bound) and
# `bun test tests/napi-overhead.test.ts` (boundary-bound; expect no signal there
# either way — those calls are marshalling and driver work, not arithmetic).
debug-assertions = true
overflow-checks = false
