[package]
authors = ["Daniel Grondin <king@numsgil.co>"]
edition = "2021"
name = "metis_native"
version = "0.1.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.0.0", features = ["async", "napi8"] }
napi-derive = "3.0.0"
mimalloc = { version = "0.1", default-features = false }
wgpu = { version = "30", features = ["wgsl"] }
raw-window-handle = "0.6"
tokio = { version = "1", features = ["sync"] }
sdl3-sys = { version = "0.6.7", features = ["build-from-source-static"] }
num_enum = "0.7.6"
lyon_tessellation = "1"
lyon_path = "1"
lyon_geom = "1"
ttf-parser = "0.21"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "tga", "hdr", "webp"] }
half = "2.7.1"
ktx2 = "0.5"
ruzstd = "0.8.3"
# glTF 2.0. `default-features = false` drops the crate's own `import` feature,
# which would pull in its own `image` copy and its own URI/base64 handling — this
# crate resolves URIs itself (see `gltf/uri.rs`) so that the resource-override
# hook can intercept before any byte is read. `extensions` keeps unrecognised
# extension objects as raw JSON instead of discarding them; `extras` does the
# same for `extras`. The KHR_* features are the ones gltf-json models natively;
# the rest (clearcoat, sheen, anisotropy, iridescence, dispersion) are parsed
# from that raw JSON in `gltf/material.rs`.
gltf = { version = "1.4.1", default-features = false, features = [
  "utils", "names", "extras", "extensions",
  "KHR_lights_punctual",
  "KHR_materials_emissive_strength",
  "KHR_materials_ior",
  "KHR_materials_specular",
  "KHR_materials_transmission",
  "KHR_materials_unlit",
  "KHR_materials_variants",
  "KHR_materials_volume",
  "KHR_texture_transform",
] }
serde_json = "1"
base64 = "0.22"
percent-encoding = "2"
# Audio decoding. Pure Rust, same rule as the image decoders — no C decoder in
# the path (see CLAUDE.md, "Why SDL3_image is gone"). `all` turns on every
# royalty-free codec and container symphonia ships (wav/flac/mp3/aac/alac/
# vorbis/adpcm + mkv/isomp4/ogg/caf/aiff) plus the metadata readers; the set is
# a compile-time cost only, and a game that can't open the file the artist
# handed it is a worse trade than a slightly longer link.
symphonia = { version = "0.6", features = ["all"] }

[build-dependencies]
napi-build = "2"

# TODO(physics): re-evaluate `lto = "fat"` once a physics engine lands here.
# Fat LTO costs ~103 s per incremental release build (vs ~19 s for `fastdev`)
# and currently buys close to nothing: this crate is a GPU-bound FFI shim, so
# the hot path is inside the driver, not in cross-crate inlining. A CPU-bound
# solver is the opposite case and is where fat LTO would start paying for
# itself — so measure it then rather than dropping it pre-emptively now.
# Decided 2026-07-21; physics ETA unknown.
[profile.release]
strip = "symbols"
opt-level = 3
lto = "fat"
codegen-units = 1

# Optimized but fast to build — for profiling runs where `release`'s fat-LTO
# link (measured: ~103 s to rebuild after a one-line change) dominates the
# edit-measure loop. Ships nothing; use `release` for that.
[profile.fastdev]
inherits = "release"
lto = false
codegen-units = 16
